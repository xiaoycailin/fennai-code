name: rust-release-windows

on:
  workflow_call:
    inputs:
      release-lto:
        required: true
        type: string
    secrets:
      AZURE_TRUSTED_SIGNING_CLIENT_ID:
        required: false
      AZURE_TRUSTED_SIGNING_TENANT_ID:
        required: false
      AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID:
        required: false
      AZURE_TRUSTED_SIGNING_ENDPOINT:
        required: false
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME:
        required: false
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME:
        required: false

jobs:
  build-windows-binaries:
    name: Build Windows binaries - ${{ matrix.runner }} - ${{ matrix.target }} - ${{ matrix.bundle }}
    runs-on: ${{ matrix.runs_on }}
    # Windows release builds can exceed an hour on fat-LTO mainline releases,
    # so keep the timeout aligned with the top-level release build headroom.
    timeout-minutes: 90
    permissions:
      contents: read
    defaults:
      run:
        working-directory: codex-rs
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ inputs.release-lto }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-responses-api-proxy"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: primary
            binaries: "codex codex-responses-api-proxy"
            runs_on: windows-latest
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: helpers
            binaries: "codex-windows-sandbox-setup codex-command-runner"
            runs_on: windows-latest
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server"
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            bundle: app-server
            binaries: "codex-app-server"
            runs_on: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Print runner specs (Windows)
        shell: powershell
        run: |
          $computer = Get-CimInstance Win32_ComputerSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $ramGiB = [math]::Round($computer.TotalPhysicalMemory / 1GB, 1)
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          Write-Host "CPU: $($cpu.Name)"
          Write-Host "Logical CPUs: $($computer.NumberOfLogicalProcessors)"
          Write-Host "Physical CPUs: $($computer.NumberOfProcessors)"
          Write-Host "Total RAM: $ramGiB GiB"
          Write-Host "Disk usage:"
          Get-PSDrive -PSProvider FileSystem | Format-Table -AutoSize Name, @{Name='Size(GB)';Expression={[math]::Round(($_.Used + $_.Free) / 1GB, 1)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free / 1GB, 1)}}
      - uses: dtolnay/rust-toolchain@a0b273b48ed29de4470960879e8381ff45632f26 # 1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Cargo build (Windows binaries)
        shell: bash
        run: |
          build_args=()
          for binary in ${{ matrix.binaries }}; do
            build_args+=(--bin "$binary")
          done
          cargo build --target ${{ matrix.target }} --release --timings "${build_args[@]}"

      - name: Upload Cargo timings
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: cargo-timings-rust-release-windows-${{ matrix.target }}-${{ matrix.bundle }}
          path: codex-rs/target/**/cargo-timings/cargo-timing.html
          if-no-files-found: warn

      - name: Stage Windows binaries
        shell: bash
        run: |
          output_dir="target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}"
          mkdir -p "$output_dir"
          for binary in ${{ matrix.binaries }}; do
            cp "target/${{ matrix.target }}/release/${binary}.exe" "$output_dir/${binary}.exe"
          done

      - name: Upload Windows binaries
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-binaries-${{ matrix.target }}-${{ matrix.bundle }}
          path: |
            codex-rs/target/${{ matrix.target }}/release/staged-${{ matrix.bundle }}/*

  build-windows:
    needs:
      - build-windows-binaries
    name: Build - ${{ matrix.runner }} - ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: codex-rs
    env:
      WINDOWS_BINARIES: "codex codex-responses-api-proxy codex-windows-sandbox-setup codex-command-runner codex-app-server"

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-x64
            target: x86_64-pc-windows-msvc
            runs_on: windows-latest
          - runner: windows-arm64
            target: aarch64-pc-windows-msvc
            runs_on: windows-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download prebuilt Windows primary binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-primary
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Download prebuilt Windows helper binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-helpers
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Download prebuilt Windows app-server binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-binaries-${{ matrix.target }}-app-server
          path: codex-rs/target/${{ matrix.target }}/release

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail
          for binary in ${WINDOWS_BINARIES}; do
            ls -lh "target/${{ matrix.target }}/release/${binary}.exe"
          done

      - name: Check Azure Trusted Signing secrets
        id: azure-signing
        shell: bash
        env:
          AZURE_TRUSTED_SIGNING_CLIENT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          AZURE_TRUSTED_SIGNING_TENANT_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
        run: |
          if [[ -n "${AZURE_TRUSTED_SIGNING_CLIENT_ID}" \
            && -n "${AZURE_TRUSTED_SIGNING_TENANT_ID}" \
            && -n "${AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID}" \
            && -n "${AZURE_TRUSTED_SIGNING_ENDPOINT}" \
            && -n "${AZURE_TRUSTED_SIGNING_ACCOUNT_NAME}" \
            && -n "${AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign Windows binaries with Azure Trusted Signing
        if: ${{ steps.azure-signing.outputs.enabled == 'true' }}
        uses: ./.github/actions/windows-code-sign
        with:
          target: ${{ matrix.target }}
          binaries: ${{ env.WINDOWS_BINARIES }}
          client-id: ${{ secrets.AZURE_TRUSTED_SIGNING_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TRUSTED_SIGNING_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_TRUSTED_SIGNING_SUBSCRIPTION_ID }}
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}

      - name: Skip signing (Azure Trusted Signing secrets not configured)
        if: ${{ steps.azure-signing.outputs.enabled != 'true' }}
        shell: bash
        run: echo "Skipping Windows code signing because Azure Trusted Signing secrets are not configured."

      - name: Stage artifacts
        shell: bash
        run: |
          dest="dist/${{ matrix.target }}"
          mkdir -p "$dest"

          for binary in ${WINDOWS_BINARIES}; do
            cp "target/${{ matrix.target }}/release/${binary}.exe" \
              "$dest/${binary}-${{ matrix.target }}.exe"
          done

      - name: Build and stage FCode tray binary
        shell: powershell
        run: |
          $traySrc = Join-Path $env:GITHUB_WORKSPACE "codex-rs\web-ui\fcode-server\Program.cs"
          $iconPath = Join-Path $env:GITHUB_WORKSPACE "codex-rs\web-ui\fcode-server\fcode-icon.ico"
          $trayOutDir = Join-Path $env:GITHUB_WORKSPACE "codex-rs\dist\${{ matrix.target }}"
          New-Item -ItemType Directory -Path $trayOutDir -Force | Out-Null
          $trayOut = Join-Path $trayOutDir "fcode-tray-${{ matrix.target }}.exe"

          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" `
            /nologo /target:winexe /optimize+ `
            /win32icon:$iconPath `
            /out:$trayOut `
            /reference:System.dll /reference:System.Core.dll /reference:System.Drawing.dll /reference:System.Windows.Forms.dll `
            $traySrc

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to build tray binary"
          }

      - name: Build Windows installer and uninstaller executables
        shell: powershell
        run: |
          $target = "${{ matrix.target }}"
          $distDir = Join-Path $env:GITHUB_WORKSPACE "codex-rs\dist\$target"
          $workDir = Join-Path $env:RUNNER_TEMP "fcode-installer-$target"
          $null = New-Item -ItemType Directory -Path $workDir -Force

          $installScript = @'
          $ErrorActionPreference = "Stop"

          function Add-UserPathEntry([string]$pathEntry) {
            $pathValue = [Environment]::GetEnvironmentVariable("Path", "User")
            if ([string]::IsNullOrWhiteSpace($pathValue)) {
              [Environment]::SetEnvironmentVariable("Path", $pathEntry, "User")
              return
            }
            $entries = $pathValue.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() }
            if ($entries -notcontains $pathEntry) {
              [Environment]::SetEnvironmentVariable("Path", ($pathValue.TrimEnd(';') + ";" + $pathEntry), "User")
            }
          }

          $installRoot = Join-Path $env:LOCALAPPDATA "FCode"
          $binDir = Join-Path $installRoot "bin"
          $null = New-Item -ItemType Directory -Path $binDir -Force

          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "codex-__TARGET__.exe") -Destination (Join-Path $binDir "fcode.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "codex-app-server-__TARGET__.exe") -Destination (Join-Path $binDir "codex-app-server.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "codex-command-runner-__TARGET__.exe") -Destination (Join-Path $binDir "codex-command-runner.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "codex-responses-api-proxy-__TARGET__.exe") -Destination (Join-Path $binDir "codex-responses-api-proxy.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "codex-windows-sandbox-setup-__TARGET__.exe") -Destination (Join-Path $binDir "codex-windows-sandbox-setup.exe") -Force
          Copy-Item -LiteralPath (Join-Path $PSScriptRoot "fcode-tray-__TARGET__.exe") -Destination (Join-Path $binDir "fcode-tray.exe") -Force

          $uninstallScript = @'
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:LOCALAPPDATA "FCode"
          $binDir = Join-Path $installRoot "bin"

          $pathValue = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not [string]::IsNullOrWhiteSpace($pathValue)) {
            $entries = $pathValue.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() }
            $newEntries = $entries | Where-Object { $_ -and ($_ -ne $binDir) }
            [Environment]::SetEnvironmentVariable("Path", ($newEntries -join ';'), "User")
          }

          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }

          Write-Output "FCode uninstalled from $installRoot"
          '@
          Set-Content -LiteralPath (Join-Path $binDir "uninstall-fcode.ps1") -Value $uninstallScript -Encoding UTF8

          Add-UserPathEntry -pathEntry $binDir

          Write-Output "Installed FCode at $installRoot"
          Write-Output "Open new terminal, then run: fcode --version"
          '@
          $installScript = $installScript.Replace("__TARGET__", $target)
          Set-Content -LiteralPath (Join-Path $workDir "install.ps1") -Value $installScript -Encoding UTF8

          Copy-Item -LiteralPath (Join-Path $distDir "codex-$target.exe") -Destination (Join-Path $workDir "codex-$target.exe") -Force
          Copy-Item -LiteralPath (Join-Path $distDir "codex-app-server-$target.exe") -Destination (Join-Path $workDir "codex-app-server-$target.exe") -Force
          Copy-Item -LiteralPath (Join-Path $distDir "codex-command-runner-$target.exe") -Destination (Join-Path $workDir "codex-command-runner-$target.exe") -Force
          Copy-Item -LiteralPath (Join-Path $distDir "codex-responses-api-proxy-$target.exe") -Destination (Join-Path $workDir "codex-responses-api-proxy-$target.exe") -Force
          Copy-Item -LiteralPath (Join-Path $distDir "codex-windows-sandbox-setup-$target.exe") -Destination (Join-Path $workDir "codex-windows-sandbox-setup-$target.exe") -Force
          Copy-Item -LiteralPath (Join-Path $distDir "fcode-tray-$target.exe") -Destination (Join-Path $workDir "fcode-tray-$target.exe") -Force

          $installerSed = Join-Path $workDir "fcode-installer.sed"
          $installerExe = Join-Path $distDir "fcode-installer-$target.exe"
          $installerSedContent = @"
[Version]
Class=IEXPRESS
SEDVersion=3
[Options]
PackagePurpose=InstallApp
ShowInstallProgramWindow=0
HideExtractAnimation=1
UseLongFileName=1
InsideCompressed=0
CAB_FixedSize=0
CAB_ResvCodeSigning=0
RebootMode=N
InstallPrompt=
DisplayLicense=
FinishMessage=
TargetName=$installerExe
FriendlyName=FCode Installer ($target)
AppLaunched=powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1
PostInstallCmd=<None>
AdminQuietInstCmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1
UserQuietInstCmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File install.ps1
SourceFiles=SourceFiles
[SourceFiles]
SourceFiles0=$workDir
[SourceFiles0]
%FILE0%=
%FILE1%=
%FILE2%=
%FILE3%=
%FILE4%=
%FILE5%=
%FILE6%=
[Strings]
FILE0=install.ps1
FILE1=codex-$target.exe
FILE2=codex-app-server-$target.exe
FILE3=codex-command-runner-$target.exe
FILE4=codex-responses-api-proxy-$target.exe
FILE5=codex-windows-sandbox-setup-$target.exe
FILE6=fcode-tray-$target.exe
"@
          Set-Content -LiteralPath $installerSed -Value $installerSedContent -Encoding ASCII

          $uninstallRunner = @'
          $ErrorActionPreference = "Stop"
          $installRoot = Join-Path $env:LOCALAPPDATA "FCode"
          $binDir = Join-Path $installRoot "bin"
          $uninstallScript = Join-Path $binDir "uninstall-fcode.ps1"

          if (Test-Path -LiteralPath $uninstallScript) {
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $uninstallScript
            exit $LASTEXITCODE
          }

          $pathValue = [Environment]::GetEnvironmentVariable("Path", "User")
          if (-not [string]::IsNullOrWhiteSpace($pathValue)) {
            $entries = $pathValue.Split(';', [System.StringSplitOptions]::RemoveEmptyEntries) | ForEach-Object { $_.Trim() }
            $newEntries = $entries | Where-Object { $_ -and ($_ -ne $binDir) }
            [Environment]::SetEnvironmentVariable("Path", ($newEntries -join ';'), "User")
          }

          if (Test-Path -LiteralPath $installRoot) {
            Remove-Item -LiteralPath $installRoot -Recurse -Force
          }
          '@
          Set-Content -LiteralPath (Join-Path $workDir "uninstall-runner.ps1") -Value $uninstallRunner -Encoding UTF8

          $uninstallerSed = Join-Path $workDir "fcode-uninstaller.sed"
          $uninstallerExe = Join-Path $distDir "fcode-uninstall-$target.exe"
          $uninstallerSedContent = @"
[Version]
Class=IEXPRESS
SEDVersion=3
[Options]
PackagePurpose=InstallApp
ShowInstallProgramWindow=0
HideExtractAnimation=1
UseLongFileName=1
InsideCompressed=0
CAB_FixedSize=0
CAB_ResvCodeSigning=0
RebootMode=N
InstallPrompt=
DisplayLicense=
FinishMessage=
TargetName=$uninstallerExe
FriendlyName=FCode Uninstaller ($target)
AppLaunched=powershell.exe -NoProfile -ExecutionPolicy Bypass -File uninstall-runner.ps1
PostInstallCmd=<None>
AdminQuietInstCmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File uninstall-runner.ps1
UserQuietInstCmd=powershell.exe -NoProfile -ExecutionPolicy Bypass -File uninstall-runner.ps1
SourceFiles=SourceFiles
[SourceFiles]
SourceFiles0=$workDir
[SourceFiles0]
%FILE0%=
[Strings]
FILE0=uninstall-runner.ps1
"@
          Set-Content -LiteralPath $uninstallerSed -Value $uninstallerSedContent -Encoding ASCII

          $iexpress = Join-Path $env:SystemRoot "System32\iexpress.exe"
          & $iexpress /N /Q $installerSed
          if ($LASTEXITCODE -ne 0) {
            throw "IExpress failed to build installer"
          }
          & $iexpress /N /Q $uninstallerSed
          if ($LASTEXITCODE -ne 0) {
            throw "IExpress failed to build uninstaller"
          }

      - name: Build Python runtime wheel
        shell: bash
        run: |
          set -euo pipefail

          case "${{ matrix.target }}" in
            aarch64-pc-windows-msvc)
              platform_tag="win_arm64"
              ;;
            x86_64-pc-windows-msvc)
              platform_tag="win_amd64"
              ;;
            *)
              echo "No Python runtime wheel platform tag for ${{ matrix.target }}"
              exit 1
              ;;
          esac

          python -m venv "${RUNNER_TEMP}/python-runtime-build-venv"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m pip install build

          stage_dir="${RUNNER_TEMP}/openai-codex-cli-bin-${{ matrix.target }}"
          wheel_dir="${GITHUB_WORKSPACE}/python-runtime-dist/${{ matrix.target }}"
          # Keep the helpers next to codex.exe in the runtime wheel so Windows
          # sandbox/elevation lookup matches the standalone release zip.
          python "${GITHUB_WORKSPACE}/sdk/python/scripts/update_sdk_artifacts.py" \
            stage-runtime \
            "$stage_dir" \
            "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex.exe" \
            --codex-version "${GITHUB_REF_NAME}" \
            --platform-tag "$platform_tag" \
            --resource-binary "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex-command-runner.exe" \
            --resource-binary "${GITHUB_WORKSPACE}/codex-rs/target/${{ matrix.target }}/release/codex-windows-sandbox-setup.exe"
          "${RUNNER_TEMP}/python-runtime-build-venv/Scripts/python.exe" -m build --wheel --outdir "$wheel_dir" "$stage_dir"

      - name: Upload Python runtime wheel
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-runtime-wheel-${{ matrix.target }}
          path: python-runtime-dist/${{ matrix.target }}/*.whl
          if-no-files-found: error

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Compress artifacts
        shell: bash
        run: |
          # Path that contains the uncompressed binaries for the current
          # ${{ matrix.target }}
          dest="dist/${{ matrix.target }}"
          repo_root=$PWD

          # For compatibility with environments that lack the `zstd` tool we
          # additionally create a `.tar.gz` and `.zip` for every Windows binary.
          # The end result is:
          #   codex-<target>.zst
          #   codex-<target>.tar.gz
          #   codex-<target>.zip
          for f in "$dest"/*; do
            base="$(basename "$f")"
            # Skip files that are already archives (shouldn't happen, but be
            # safe).
            if [[ "$base" == *.tar.gz || "$base" == *.zip || "$base" == *.dmg ]]; then
              continue
            fi

            # Don't try to compress signature bundles.
            if [[ "$base" == *.sigstore ]]; then
              continue
            fi

            # Create per-binary tar.gz
            tar -C "$dest" -czf "$dest/${base}.tar.gz" "$base"

            # Create zip archive for Windows binaries.
            # Must run from inside the dest dir so 7z won't embed the
            # directory path inside the zip.
            if [[ "$base" == "codex-${{ matrix.target }}.exe" ]]; then
              # Bundle the sandbox helper binaries into the main codex zip so
              # WinGet installs include the required helpers next to codex.exe.
              # Fall back to the single-binary zip if the helpers are missing
              # to avoid breaking releases.
              bundle_dir="$(mktemp -d)"
              runner_src="$dest/codex-command-runner-${{ matrix.target }}.exe"
              setup_src="$dest/codex-windows-sandbox-setup-${{ matrix.target }}.exe"
              if [[ -f "$runner_src" && -f "$setup_src" ]]; then
                cp "$dest/$base" "$bundle_dir/$base"
                cp "$runner_src" "$bundle_dir/codex-command-runner.exe"
                cp "$setup_src" "$bundle_dir/codex-windows-sandbox-setup.exe"
                # Use an absolute path so bundle zips land in the real dist
                # dir even when 7z runs from a temp directory.
                (cd "$bundle_dir" && 7z a "$repo_root/$dest/${base}.zip" .)
              else
                echo "warning: missing sandbox binaries; falling back to single-binary zip"
                echo "warning: expected $runner_src and $setup_src"
                (cd "$dest" && 7z a "${base}.zip" "$base")
              fi
              rm -rf "$bundle_dir"
            else
              (cd "$dest" && 7z a "${base}.zip" "$base")
            fi

            # Keep raw executables and produce .zst alongside them.
            "${GITHUB_WORKSPACE}/.github/workflows/zstd" -T0 -19 "$dest/$base"
          done

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            codex-rs/dist/${{ matrix.target }}/*
